name: Release gem

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      BUNDLE_WITHOUT: integration
    permissions:
      contents: write
      id-token: write
    environment: release
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
      - name: Verify tag matches gem version
        run: |
          version="$(ruby -Ilib -rengram/version -e 'print Engram::VERSION')"
          expected="v${version}"
          if ! printf '%s' "$GITHUB_REF_NAME" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$'; then
            echo "Invalid release tag: $GITHUB_REF_NAME" >&2
            exit 1
          fi
          if [ "$GITHUB_REF_NAME" != "$expected" ]; then
            echo "Tag $GITHUB_REF_NAME does not match gem version $version (expected $expected)" >&2
            exit 1
          fi
      - uses: rubygems/release-gem@v1
