name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    env:
      BUNDLE_WITHOUT: integration
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
      - run: bundle exec standardrb

  test:
    runs-on: ubuntu-latest
    env:
      BUNDLE_WITHOUT: integration
    strategy:
      fail-fast: false
      matrix:
        ruby: ["3.2", "3.3", "3.4"]
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - run: bundle exec rspec

  eval:
    runs-on: ubuntu-latest
    env:
      BUNDLE_WITHOUT: integration
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
      - run: bundle exec rake eval

  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: engram_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/engram_test
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
      - run: bundle exec rspec --tag integration

  package:
    runs-on: ubuntu-latest
    env:
      BUNDLE_WITHOUT: integration
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
      - name: Build and verify gem artifact
        run: |
          version="$(bundle exec ruby -Ilib -rengram/version -e 'print Engram::VERSION')"
          bundle exec gem build engram.gemspec
          artifact="engram-${version}.gem"
          test -f "$artifact"
          test "$(ruby -rrubygems/package -e 'print Gem::Package.new(ARGV.fetch(0)).spec.name' "$artifact")" = "engram"
          test "$(ruby -rrubygems/package -e 'print Gem::Package.new(ARGV.fetch(0)).spec.version' "$artifact")" = "$version"
          printf '%s\n' "$artifact" > /tmp/engram-artifact
      - name: Install and smoke test as an external consumer
        run: |
          artifact="$GITHUB_WORKSPACE/$(cat /tmp/engram-artifact)"
          export GEM_HOME="$RUNNER_TEMP/engram-gems"
          export GEM_PATH="$GEM_HOME"
          export PATH="$GEM_HOME/bin:$PATH"
          gem install --no-document "$artifact"
          consumer_dir="$(mktemp -d)"
          cd "$consumer_dir"
          env -u BUNDLE_GEMFILE ruby -rengram -e 'memory = Engram::Memory.new(scope: "smoke"); record = memory.add("package works", kind: :fact); abort "smoke failed" unless record && memory.recall("package works").include?(record)'
